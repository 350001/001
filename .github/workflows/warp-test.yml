name: Xray WARP Tunnel Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v6


      # -----------------------------
      # Cache Xray
      # -----------------------------
      - name: Cache Xray
        uses: actions/cache@v6
        with:
          path: ~/xray
          key: xray-v26.3.27-linux-amd64


      # -----------------------------
      # Cloudflared version
      # -----------------------------
      - name: Get cloudflared version
        id: cloudflared-version
        run: |
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest \
            | jq -r '.tag_name')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # -----------------------------
      # Cache cloudflared
      # -----------------------------
      - name: Cache cloudflared
        uses: actions/cache@v6
        with:
          path: ~/cloudflared
          key: cloudflared-${{ steps.cloudflared-version.outputs.version }}


      # -----------------------------
      # Install tools
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            curl \
            wget \
            unzip \
            jq


      # -----------------------------
      # Install Cloudflare WARP
      # -----------------------------
      - name: Install WARP
        run: |

          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/cloudflare-warp.gpg


          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ noble main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list


          sudo apt update

          sudo apt install -y cloudflare-warp



      # -----------------------------
      # Restore WARP
      # -----------------------------
      - name: Restore WARP data
        run: |

          echo "${{ vars.WARP_DATA }}" \
            | base64 -d > /tmp/warp.tar.gz


          sudo systemctl stop warp-svc || true


          sudo rm -rf /var/lib/cloudflare-warp


          sudo tar xzf /tmp/warp.tar.gz \
            -C /var/lib


          sudo chown -R root:root \
            /var/lib/cloudflare-warp



      # -----------------------------
      # Start WARP SOCKS
      # -----------------------------
      - name: Start WARP proxy
        run: |

          sudo systemctl restart warp-svc


          sleep 5


          warp-cli --accept-tos mode proxy


          warp-cli --accept-tos proxy port 40000


          warp-cli --accept-tos connect


          sleep 10


          warp-cli --accept-tos status



      # -----------------------------
      # Test WARP
      # -----------------------------
      - name: Test WARP
        run: |

          curl --socks5-hostname 127.0.0.1:40000 \
            https://www.cloudflare.com/cdn-cgi/trace



      # -----------------------------
      # Install Xray
      # -----------------------------
      - name: Install Xray
        run: |

          mkdir -p ~/xray


          if [ ! -x ~/xray/xray ]; then

            wget -q \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip \
            -O /tmp/xray.zip


            unzip -oq /tmp/xray.zip \
              -d ~/xray


            chmod +x ~/xray/xray

          fi


          ~/xray/xray version



      # -----------------------------
      # Generate Xray config
      # -----------------------------
      - name: Generate Xray config
        env:
          XRAY_CONFIG: ${{ vars.XRAY_CONFIG }}

        run: |

          mkdir -p ~/xray


          printf '%s' "$XRAY_CONFIG" \
            > ~/xray/config.json


          jq . ~/xray/config.json



      # -----------------------------
      # Start Xray
      # -----------------------------
      - name: Start Xray
        run: |

          nohup ~/xray/xray run \
            -config ~/xray/config.json \
            > ~/xray/xray.log 2>&1 &


          sleep 5


          cat ~/xray/xray.log



      # -----------------------------
      # Install cloudflared
      # -----------------------------
      - name: Install cloudflared
        run: |

          mkdir -p ~/cloudflared


          if [ ! -x ~/cloudflared/cloudflared ]; then

            wget -q \
            https://github.com/cloudflare/cloudflared/releases/download/${{ steps.cloudflared-version.outputs.version }}/cloudflared-linux-amd64 \
            -O ~/cloudflared/cloudflared


            chmod +x ~/cloudflared/cloudflared

          fi


          ~/cloudflared/cloudflared --version



      # -----------------------------
      # Start Tunnel
      # -----------------------------
      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ vars.CLOUDFLARE_TUNNEL_TOKEN }}

        run: |

          nohup ~/cloudflared/cloudflared tunnel run \
            --token "$TUNNEL_TOKEN" \
            > ~/cloudflared/cloudflared.log 2>&1 &


          sleep 15


          cat ~/cloudflared/cloudflared.log



      # -----------------------------
      # Run test
      # -----------------------------
      - name: Wait and collect logs
        run: |

          echo "Services running..."

          sleep 300



      # -----------------------------
      # Final status
      # -----------------------------
      - name: Check status
        if: always()
        run: |

          echo "===== WARP ====="
          warp-cli --accept-tos status || true


          echo
          echo "===== Xray process ====="
          ps aux | grep xray | grep -v grep || true


          echo
          echo "===== Cloudflared process ====="
          ps aux | grep cloudflared | grep -v grep || true


          echo
          echo "===== Xray log ====="
          cat ~/xray/xray.log || true


          echo
          echo "===== Cloudflared log ====="
          cat ~/cloudflared/cloudflared.log || true