name: Test Cloudflare WARP

on:
  workflow_dispatch:

jobs:
  warp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Cloudflare WARP
        run: |
          curl https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --dearmor \
            | sudo tee /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg >/dev/null

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt update
          sudo apt install -y cloudflare-warp


      - name: Restore WARP data
        run: |
          echo "${{ secrets.WARP_DATA }}" | base64 -d > /tmp/warp.tar.gz

          sudo systemctl stop warp-svc || true

          sudo rm -rf /var/lib/cloudflare-warp

          sudo tar xzf /tmp/warp.tar.gz -C /var/lib

          sudo chown -R root:root /var/lib/cloudflare-warp
          sudo chmod 700 /var/lib/cloudflare-warp


      - name: Start WARP service
        run: |
          sudo systemctl start warp-svc
          sleep 5

          warp-cli --accept-tos status
          warp-cli --accept-tos registration show


      - name: Enable WARP SOCKS proxy
        run: |
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect

          sleep 10

          warp-cli --accept-tos status


      - name: Test WARP connection
        run: |
          curl --socks5-hostname 127.0.0.1:40000 \
            https://www.cloudflare.com/cdn-cgi/trace
