name: Xray + WARP + Cloudflared

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # =========================
      # Cache apt packages
      # =========================
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-warp-v1
          restore-keys: |
            apt-${{ runner.os }}-

      # =========================
      # Cache Xray
      # =========================
      - name: Cache Xray
        uses: actions/cache@v4
        with:
          path: ~/xray
          key: xray-v26.3.27-linux-amd64

      # =========================
      # Get latest Cloudflared version
      # =========================
      - name: Get latest Cloudflared version
        id: cloudflared-version
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Cloudflared Version: $VERSION"

      # =========================
      # Cache Cloudflared
      # =========================
      - name: Cache Cloudflared
        uses: actions/cache@v4
        with:
          path: ~/cloudflared
          key: cloudflared-${{ runner.os }}-${{ runner.arch }}-${{ steps.cloudflared-version.outputs.version }}

      # =========================
      # Install WARP
      # =========================
      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/cloudflare-warp.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ noble main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

          sudo apt-get update

          sudo apt-get install -y \
            cloudflare-warp \
            unzip

      # =========================
      # Restore WARP
      # =========================
      - name: Restore WARP data
        run: |
          echo "${{ secrets.WARP_DATA }}" | base64 -d > /tmp/warp.tar.gz

          sudo systemctl stop warp-svc || true

          sudo rm -rf /var/lib/cloudflare-warp

          sudo tar xzf /tmp/warp.tar.gz -C /var/lib

      # =========================
      # Start WARP
      # =========================
      - name: Start WARP
        run: |
          sudo systemctl restart warp-svc

          sleep 5

          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000

          warp-cli --accept-tos connect

          sleep 10

          warp-cli --accept-tos status
          warp-cli --accept-tos registration show

      # =========================
      # Verify SOCKS5
      # =========================
      - name: Check SOCKS5
        run: |
          ss -lntp | grep 40000

      # =========================
      # Test WARP
      # =========================
      - name: Test WARP
        run: |
          curl --socks5-hostname 127.0.0.1:40000 \
            https://www.cloudflare.com/cdn-cgi/trace

      # =========================
      # Download Xray v26.3.27
      # =========================
      - name: Download Xray
        run: |
          if [ ! -x "$HOME/xray/xray" ]; then
            mkdir -p "$HOME/xray"

            wget -q \
              https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip \
              -O /tmp/xray.zip

            unzip -oq /tmp/xray.zip -d "$HOME/xray"

            chmod +x "$HOME/xray/xray"
          fi

          "$HOME/xray/xray" version

      # =========================
      # Download Cloudflared
      # =========================
      - name: Download Cloudflared
        run: |
          mkdir -p "$HOME/cloudflared"

          if [ ! -x "$HOME/cloudflared/cloudflared" ]; then
            wget -q \
              "https://github.com/cloudflare/cloudflared/releases/download/${{ steps.cloudflared-version.outputs.version }}/cloudflared-linux-amd64" \
              -O "$HOME/cloudflared/cloudflared"

            chmod +x "$HOME/cloudflared/cloudflared"
          fi

          "$HOME/cloudflared/cloudflared" --version
