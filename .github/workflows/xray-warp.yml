name: Xray WARP Gateway Test

on:
  workflow_dispatch:

concurrency:
  group: xray-warp-gateway
  cancel-in-progress: true

env:
  XRAY_VERSION: 26.3.27
  WARP_CONFIG_VERSION: v1

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Xray
        uses: actions/cache@v6
        with:
          path: ~/xray
          key: xray-${{ env.XRAY_VERSION }}-${{ runner.arch }}

      - name: Get cloudflared version
        id: cloudflared-version
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name') || VERSION="2026.7.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache cloudflared
        uses: actions/cache@v6
        with:
          path: ~/cloudflared
          key: cloudflared-${{ steps.cloudflared-version.outputs.version }}

      - name: Cache WARP Config
        id: warp-cache
        uses: actions/cache@v6
        with:
          path: ~/warp-config
          key: warp-config-${{ runner.os }}-${{ env.WARP_CONFIG_VERSION }}

      - name: Install WARP
        if: steps.warp-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt update
          sudo apt install -y cloudflare-warp

      - name: Register WARP
        if: steps.warp-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          sudo systemctl restart warp-svc
          WARP_OK=false
          for i in {1..30}; do
            if warp-cli --accept-tos status >/dev/null 2>&1; then
              WARP_OK=true
              break
            fi
            sleep 2
          done
          if [ "$WARP_OK" != "true" ]; then
            echo "warp-svc not ready"
            exit 1
          fi
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          WARP_OK=false
          for i in {1..15}; do
            if curl -fsS \
            https://www.cloudflare.com/cdn-cgi/trace \
            | grep -q '^warp=on$'; then
              WARP_OK=true
              break
            fi
            sleep 2
          done
          if [ "$WARP_OK" != "true" ]; then
            echo "Initial WARP connection failed"
            exit 1
          fi
          warp-cli --accept-tos tunnel protocol set WireGuard
          warp-cli --accept-tos disconnect
          sleep 2
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos disconnect
          mkdir -p ~/warp-config
          sudo cp /var/lib/cloudflare-warp/reg.json \
          ~/warp-config/
          sudo cp /var/lib/cloudflare-warp/conf.json \
          ~/warp-config/
          sudo chown -R $USER:$USER ~/warp-config
          test -f ~/warp-config/reg.json
          test -f ~/warp-config/conf.json

      - name: Install Xray
        run: |
          set -Eeuo pipefail
          mkdir -p ~/xray
          if [ ! -x ~/xray/xray ]; then
            wget -q https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip -O /tmp/xray.zip
            unzip -oq /tmp/xray.zip -d ~/xray
            chmod +x ~/xray/xray
          fi
          ~/xray/xray version

      - name: Generate Xray Config
        env:
          XRAY_CLIENTS: ${{ vars.XRAY_CLIENTS }}
          WARP_ENDPOINT: ${{ vars.WARP_ENDPOINT }}
          WARP_MTU: ${{ vars.WARP_MTU }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/xray
          if [ -n "${WARP_ENDPOINT:-}" ]; then
            ENDPOINT="$WARP_ENDPOINT"
          else
            ENDPOINT=$(jq -r '.endpoints[0].v4' ~/warp-config/conf.json)
          fi
          PRIVATE_KEY=$(jq -r '.secret_key' ~/warp-config/reg.json)
          PUBLIC_KEY=$(jq -r '.public_key' ~/warp-config/conf.json)
          IPV4=$(jq -r '.interface.v4' ~/warp-config/conf.json)
          MTU=${WARP_MTU:-1280}
          export ENDPOINT
          export PRIVATE_KEY
          export PUBLIC_KEY
          export IPV4
          export MTU
          envsubst \
            < xray/config.template.json \
            > ~/xray/config.json
          jq . ~/xray/config.json

      - name: Test Xray Config
        run: |
          set -Eeuo pipefail
          ~/xray/xray run \
          -test \
          -config ~/xray/config.json

      - name: Start Xray
        run: |
          nohup ~/xray/xray run -config ~/xray/config.json > ~/xray/xray.log 2>&1 &

      - name: Install cloudflared
        run: |
          set -Eeuo pipefail
          mkdir -p ~/cloudflared
          if [ ! -x ~/cloudflared/cloudflared ]; then
            wget -q https://github.com/cloudflare/cloudflared/releases/download/${{ steps.cloudflared-version.outputs.version }}/cloudflared-linux-amd64 -O ~/cloudflared/cloudflared
            chmod +x ~/cloudflared/cloudflared
          fi
          ~/cloudflared/cloudflared --version

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          test -n "$TUNNEL_TOKEN"
          nohup ~/cloudflared/cloudflared tunnel run > ~/cloudflared/cloudflared.log 2>&1 &

      - name: Running
        env:
          XRAY_RUNTIME: ${{ vars.XRAY_RUNTIME }}
        run: |
          touch ~/xray/xray.log
          touch ~/cloudflared/cloudflared.log
          echo "================================"
          echo "Xray + WARP + Cloudflared Ready"
          echo "================================"
          echo
          echo "===== LIVE LOG (${TEST_TIME}s) ====="
          timeout ${XRAY_RUNTIME:-300}s bash -c '
            tail -F ~/xray/xray.log ~/cloudflared/cloudflared.log
          ' || { EXIT=$?; if [ $EXIT -ne 124 ]; then exit $EXIT; fi; }
          echo
          echo "================================"
          echo "Test finished."
          echo "================================"