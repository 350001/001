name: Xray WARP Gateway Test

on:
  workflow_dispatch:

concurrency:
  group: xray-warp-gateway
  cancel-in-progress: true

env:
  XRAY_VERSION: 26.3.27
  TEST_TIME: 300
  WARP_CONFIG_VERSION: v1

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Xray
        uses: actions/cache@v6
        with:
          path: ~/xray
          key: xray-${{ env.XRAY_VERSION }}-${{ runner.arch }}

      - name: Get cloudflared version
        id: cloudflared-version
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name') || VERSION="2026.7.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache cloudflared
        uses: actions/cache@v6
        with:
          path: ~/cloudflared
          key: cloudflared-${{ steps.cloudflared-version.outputs.version }}

      - name: Cache WARP Config
        uses: actions/cache@v6
        with:
          path: ~/warp-config
          key: warp-config-${{ runner.os }}-${{ env.WARP_CONFIG_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y curl wget unzip jq gnupg

      - name: Install WARP
        run: |
          set -Eeuo pipefail
          curl -fsSL \
          https://pkg.cloudflareclient.com/pubkey.gpg \
          | sudo gpg --dearmor \
          -o /usr/share/keyrings/cloudflare-warp.gpg
          echo \
          "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
          | sudo tee \
          /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt update
          sudo apt install -y cloudflare-warp

      - name: Restore WARP
        run: |
          set -Eeuo pipefail
          sudo systemctl stop warp-svc || true
          if [ -d ~/warp-config ]
          then
            sudo rm -rf /var/lib/cloudflare-warp
            sudo cp -a ~/warp-config /var/lib/cloudflare-warp
            sudo chown -R root:root /var/lib/cloudflare-warp
          fi

      - name: Start WARP proxy
        run: |
          sudo systemctl restart warp-svc
          for i in {1..30}
          do
            if warp-cli --accept-tos status >/dev/null 2>&1
            then
              break
            fi
            sleep 2
          done
          if ! warp-cli --accept-tos registration show >/dev/null 2>&1
          then
            warp-cli --accept-tos registration new
            rm -rf ~/warp-config
            sudo cp -a /var/lib/cloudflare-warp ~/warp-config
            sudo chown -R $USER:$USER ~/warp-config
          fi
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in {1..10}; do
            if curl -s --socks5 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on$'; then
              break
            fi
            sleep 2
            if [ $i -eq 10 ]; then
              echo "WARP proxy not functional after 20s, resetting..."
              warp-cli --accept-tos disconnect
              warp-cli --accept-tos registration delete || true
              warp-cli --accept-tos registration new
              warp-cli --accept-tos mode proxy
              warp-cli --accept-tos proxy port 40000
              warp-cli --accept-tos connect
              rm -rf ~/warp-config
              sudo cp -a /var/lib/cloudflare-warp ~/warp-config
              sudo chown -R $USER:$USER ~/warp-config
              sleep 2
              if ! curl -s --socks5 127.0.0.1:40000 https://cp.cloudflare.com -o /dev/null; then
                echo "WARP proxy still not functional after reset. Exiting."
                exit 1
              fi
            fi
          done

      - name: Install Xray
        run: |
          mkdir -p ~/xray
          if [ ! -x ~/xray/xray ]
          then
            wget -q \
            https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip \
            -O /tmp/xray.zip
            unzip -oq \
            /tmp/xray.zip \
            -d ~/xray
            chmod +x ~/xray/xray
          fi
          ~/xray/xray version

      - name: Generate Xray config
        env:
          XRAY_CONFIG: ${{ vars.XRAY_CONFIG }}
        run: |
          test -n "$XRAY_CONFIG"
          printf '%s' \
          "$XRAY_CONFIG" \
          > ~/xray/config.json
          jq . ~/xray/config.json

      - name: Start Xray
        run: |
          nohup ~/xray/xray run \
          -config ~/xray/config.json \
          > ~/xray/xray.log 2>&1 &

      - name: Install cloudflared
        run: |
          mkdir -p ~/cloudflared
          if [ ! -x ~/cloudflared/cloudflared ]
          then
            wget -q \
            https://github.com/cloudflare/cloudflared/releases/download/${{ steps.cloudflared-version.outputs.version }}/cloudflared-linux-amd64 \
            -O ~/cloudflared/cloudflared
            chmod +x ~/cloudflared/cloudflared
          fi
          ~/cloudflared/cloudflared --version

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          test -n "$TUNNEL_TOKEN"
          nohup ~/cloudflared/cloudflared tunnel run \
          --token "$TUNNEL_TOKEN" \
          > ~/cloudflared/cloudflared.log 2>&1 &

      - name: Running
        run: |
          touch ~/xray/xray.log
          touch ~/cloudflared/cloudflared.log
          echo "================================"
          echo "Xray + WARP + Cloudflared Ready"
          echo "================================"
          echo
          echo "===== LIVE LOG (${TEST_TIME}s) ====="
          timeout ${TEST_TIME}s bash -c '
            tail -F \
              ~/xray/xray.log \
              ~/cloudflared/cloudflared.log
          ' || { EXIT=$?; if [ $EXIT -ne 124 ]; then exit $EXIT; fi; }
          echo
          echo "================================"
          echo "Test finished."
          echo "================================"