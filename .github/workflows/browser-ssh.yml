name: Cloudflare Web Terminal

on:
  workflow_dispatch:

concurrency:
  group: web-terminal
  cancel-in-progress: true

env:
  TUNNEL_TOKEN: ${{ secrets.SSH_TUNNEL_TOKEN }}

jobs:
  terminal:
    runs-on: ubuntu-latest

    steps:

      - name: Install cloudflared
        run: |
          set -Eeuo pipefail
          mkdir -p ~/cloudflared
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest |
            jq -r '.tag_name')
          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-amd64" \
            -o ~/cloudflared/cloudflared
          chmod +x ~/cloudflared/cloudflared

      - name: Start ttyd
        run: |
          set -Eeuo pipefail
          if ! command -v ttyd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ttyd
          fi
          nohup ttyd \
            --writable \
            -i 127.0.0.1 \
            -p 18080 \
            sudo -i \
            > ~/ttyd.log 2>&1 &
          echo $! > ~/ttyd.pid
          sleep 2
          curl -fsS \
            http://127.0.0.1:18080/ \
            >/dev/null
          echo "✅ ttyd ready"

      - name: Start Cloudflare Tunnel
        run: |
          set -Eeuo pipefail
          test -n "$TUNNEL_TOKEN"
          nohup ~/cloudflared/cloudflared tunnel \
            > /dev/null 2>&1 &
          echo "✅ Cloudflare Tunnel started"

      - name: Keep alive
        run: |
          echo
          echo "======================================"
          echo " Cloudflare Web Terminal READY"
          echo "======================================"
          echo
          echo "https://ssh.zhongguotaiwan.eu.org"
          echo
          echo "===== ttyd log ====="
          tail -F ~/ttyd.log
