name: Cloudflare Web Terminal

on:
  workflow_dispatch:

concurrency:
  group: web-terminal
  cancel-in-progress: true

env:
  TUNNEL_TOKEN: ${{ secrets.SSH_TUNNEL_TOKEN }}
  ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}

jobs:
  terminal:
    runs-on: ubuntu-latest

    steps:

      - name: Install cloudflared
        run: |
          set -Eeuo pipefail
          mkdir -p ~/cloudflared
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest |
            jq -r '.tag_name')
          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-amd64" \
            -o ~/cloudflared/cloudflared
          chmod +x ~/cloudflared/cloudflared

      - name: Prepare SSH
        run: |
          set -Eeuo pipefail
          if ! command -v sshd >/dev/null 2>&1; then
            echo "==> Installing openssh-server..."
            sudo apt-get update
            sudo apt-get install -y openssh-server
          else
            echo "==> openssh-server already installed"
          fi
          test -n "$ROOT_PASSWORD"
          echo "==> Setting root password..."
          echo "root:$ROOT_PASSWORD" | sudo chpasswd
          echo "==> Configuring root SSH login..."
          sudo mkdir -p /etc/ssh/sshd_config.d
          sudo tee /etc/ssh/sshd_config.d/99-root-login.conf >/dev/null <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          UsePAM yes
          EOF
          echo "==> Validating sshd configuration..."
          sudo sshd -t
          echo "==> Starting SSH server..."
          sudo systemctl enable ssh
          sudo systemctl restart ssh
          echo "==> SSH listening:"
          sudo ss -lntp | grep ':22 ' || true
          echo "✅ SSH ready"

      - name: Start Cloudflare Tunnel
        run: |
          set -Eeuo pipefail
          test -n "$TUNNEL_TOKEN"
          nohup ~/cloudflared/cloudflared tunnel run \
            --token "$TUNNEL_TOKEN" \
            > /dev/null 2>&1 &
          echo "✅ Cloudflare Tunnel started"

      - name: Keep alive
        run: |
          echo
          echo "======================================"
          echo " Cloudflare Browser SSH READY"
          echo "======================================"
          echo
          echo "SSH user: root"
          echo
          echo "======================================"
          while true; do
            sleep 300
          done
