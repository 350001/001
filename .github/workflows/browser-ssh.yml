name: Cloudflare Web Terminal

on:
  workflow_dispatch:

concurrency:
  group: web-terminal
  cancel-in-progress: true

env:
  TUNNEL_TOKEN: ${{ secrets.SSH_TUNNEL_TOKEN }}
  ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}

jobs:
  terminal:
    runs-on: ubuntu-latest

    steps:

      - name: Install cloudflared
        run: |
          set -Eeuo pipefail
          mkdir -p ~/cloudflared
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest |
            jq -r '.tag_name')
          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-amd64" \
            -o ~/cloudflared/cloudflared
          chmod +x ~/cloudflared/cloudflared



      - name: Start Cloudflare Tunnel
        run: |
          set -Eeuo pipefail
          test -n "$TUNNEL_TOKEN"
          nohup ~/cloudflared/cloudflared tunnel run \
            --token "$TUNNEL_TOKEN" \
            > /dev/null 2>&1 &
          echo "✅ Cloudflare Tunnel started"

      - name: Keep alive
        run: |
          echo
          echo "======================================"
          echo " Cloudflare Browser SSH READY"
          echo "======================================"
          echo
          echo "SSH user: root"
          echo
          echo "======================================"
          while true; do
            sleep 300
          done
