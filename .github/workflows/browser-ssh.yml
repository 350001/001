name: Cloudflare Web Terminal Test

on:
  workflow_dispatch:

concurrency:
  group: web-terminal-test
  cancel-in-progress: true

env:
  TUNNEL_TOKEN: ${{ secrets.SSH_TUNNEL_TOKEN }}

jobs:
  terminal:
    runs-on: ubuntu-latest

    steps:

      - name: Install ttyd
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y ttyd

          ttyd --version

      - name: Install cloudflared
        run: |
          set -Eeuo pipefail

          mkdir -p ~/cloudflared

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest |
            jq -r '.tag_name')

          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/download/${VERSION}/cloudflared-linux-amd64" \
            -o ~/cloudflared/cloudflared

          chmod +x ~/cloudflared/cloudflared

          ~/cloudflared/cloudflared --version

      - name: Start ttyd
        run: |
          set -Eeuo pipefail

          nohup ttyd \
            -i 127.0.0.1 \
            -p 7681 \
            bash \
            > ~/ttyd.log 2>&1 &

          echo $! > ~/ttyd.pid

          sleep 2

          curl -fsS http://127.0.0.1:7681 >/dev/null

          echo "✅ ttyd ready"

      - name: Start Cloudflare Tunnel
        run: |
          set -Eeuo pipefail

          test -n "$TUNNEL_TOKEN"

          nohup ~/cloudflared/cloudflared tunnel run \
            --token "$TUNNEL_TOKEN" \
            > ~/cloudflared.log 2>&1 &

          echo $! > ~/cloudflared.pid

          echo "⏳ Waiting for Cloudflare Tunnel..."

          for i in {1..60}; do
            if grep -q "Registered tunnel connection" \
              ~/cloudflared.log 2>/dev/null; then

              echo "✅ Cloudflare Tunnel connected"
              break
            fi

            sleep 2
          done

      - name: Keep alive
        run: |
          echo
          echo "======================================"
          echo " Cloudflare Web Terminal READY"
          echo "======================================"
          echo
          echo "https://ssh-test.你的域名"
          echo

          while true; do
            echo "===== $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
            ps -eo pid,comm,%cpu,%mem,etime --sort=-%cpu |
              head -n 15
            echo
            sleep 60
          done
